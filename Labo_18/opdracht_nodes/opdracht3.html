<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Opdracht 3</title>
    <style>
        #myDIV {
            border: 1px solid black;
            margin-bottom: 10px;
        }
    </style>
    <script>
        const voegParagraafToe = () => {
            // nieuw p element maken
            let p = document.createElement("p");
            p.textContent = "Nieuw paragraaf element!";

            // div zoeken
            let div = document.getElementById("myDIV");
            // toevoegen
            div.appendChild(p);
        };

        const setup = () => {
            document.getElementById("btn").addEventListener("click", voegParagraafToe);
        };

        window.addEventListener("load", setup);
    </script>
</head>
<body>
<p>Klik op een knop om een p-element aan te maken.</p>
<button id="btn">Maak paragraaf</button>
<div id="myDIV">
    Dit is een div-element
</div>
</body>
</html>
