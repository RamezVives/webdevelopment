<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Kalender Opdracht</title>
    <link rel="stylesheet" href="Styles/StyleKalender.css">
</head>
<body>

<table class="kalender">
    <thead>
    <tr>
        <th colspan="7" class="month">Januari 2025</th>
    </tr>
    <tr class="days">
        <th>Ma</th>
        <th>Di</th>
        <th>Wo</th>
        <th>Do</th>
        <th>Vr</th>
        <th>Za</th>
        <th>Zo</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td class="prev-month">30</td>
        <td class="prev-month">31</td>
        <td>1</td>  <!-- Nieuwjaar, feestdag -->
        <td>2</td>
        <td>3</td>
        <td class="feest">4</td>
        <td class="feest">5</td>
    </tr>
    <tr>
        <td class="feest">6</td>
        <td>7</td>
        <td>8</td>
        <td>9</td>
        <td>10</td>
        <td class="feest">11</td>
        <td class="feest">12</td>
    </tr>
    <tr>
        <td>13</td>
        <td>14</td>
        <td>15</td>
        <td>16</td>
        <td>17</td>
        <td class="feest">18</td>
        <td class="feest">19</td>
    </tr>
    <tr>
        <td>20</td>
        <td>21</td>
        <td>22</td>
        <td>23</td>
        <td>24</td>
        <td class="feest">25</td> <!-- Feestdag -->
        <td class="feest">26</td>
    </tr>
    <tr>
        <td>27</td>
        <td>28</td>
        <td>29</td>
        <td>30</td>
        <td>31</td>
        <td class="next-month">1</td>
        <td class="next-month">2</td>
    </tr>
    </tbody>
</table>

</body>
</html>
