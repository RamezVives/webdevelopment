<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Labo 15</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="Scripts/script.js"></script>
</head>
<body>
<h1>Producten</h1>

<table border="1">
    <tr>
        <th>Product</th>
        <th>Prijs</th>
        <th>Aantal</th>
        <th>BTW</th>
        <th>Subtotaal</th>
    </tr>

    <tr>
        <td>Product 1</td>
        <td class="prijs">10.00 Eur</td>
        <td><input type="number" class="aantal" value="0"></td>
        <td class="btw">6%</td>
        <td class="subtotaal">0.00 Eur</td>
    </tr>

    <tr>
        <td>Product 2</td>
        <td class="prijs">15.00 Eur</td>
        <td><input type="number" class="aantal" value="0"></td>
        <td class="btw">21%</td>
        <td class="subtotaal">0.00 Eur</td>
    </tr>

    <tr>
        <td>Product 3</td>
        <td class="prijs">12.20 Eur</td>
        <td><input type="number" class="aantal" value="0"></td>
        <td class="btw">21%</td>
        <td class="subtotaal">0.00 Eur</td>
    </tr>

</table>

<br>

<button id="btn">Herbereken</button>

<p>Totaal: <span id="totaal">0.00 Eur</span></p>

</body>
</html>
