<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Labo 16</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="Scripts/script.js"></script>
</head>
<body>
<form>

    <fieldset>
        <legend>Persoonlijke informatie</legend>

        <label for="voornaam">Voornaam*</label>
        <input type="text" id="voornaam" name="voornaam" placeholder="Your first name" autofocus>

        <br><br>

        <label for="familienaam">Familienaam*</label>
        <input type="text" id="familienaam" name="familienaam" placeholder="Your last name">

    </fieldset>

    <br>

    <fieldset>
        <legend>Sport</legend>

        <p>Welke sport beoefen je?</p>

        <input type="checkbox" id="lopen" name="sport" value="lopen">
        <label for="lopen">Lopen</label>

        <br>

        <input type="checkbox" id="zwemmen" name="sport" value="zwemmen">
        <label for="zwemmen">Zwemmen</label>

        <br>

        <input type="checkbox" id="roeien" name="sport" value="roeien">
        <label for="roeien">Roeien</label>

    </fieldset>

    <br>

    <fieldset>
        <legend>Communicatievoorkeur</legend>

        <p>Hoe kunnen we je bereiken?</p>

        <input type="radio" id="post" name="contact" value="post">
        <label for="post">Per post</label>

        <br>

        <input type="radio" id="emailContact" name="contact" value="email">
        <label for="emailContact">E-mail</label>

    </fieldset>

    <br>

    <fieldset>
        <legend>Favorieten</legend>

        <label for="film">Favoriete film</label>
        <input type="text" id="film" name="film">

        <br><br>

        <label for="quote">Favoriete quote</label>
        <input type="text" id="quote" name="quote" placeholder="Schrijf je favoriete quote">

        <br><br>

        <label for="eten">Favoriete eten</label>

        <select id="eten" name="eten">
            <option>Hamburger</option>
            <option>Hot-dog</option>
            <option>Pizza</option>
        </select>

        <br><br>

        <label for="browser">Favoriete browser</label>

        <input list="browsers" id="browser" name="browser">

        <datalist id="browsers">
            <option value="Chrome">
            <option value="Firefox">
            <option value="Edge">
            <option value="Safari">
        </datalist>

    </fieldset>

    <br>

    <fieldset>
        <legend>Beveiliging & contact</legend>

        <label for="wachtwoord">Wachtwoord*</label>
        <input type="password" id="wachtwoord" name="wachtwoord">

        <br><br>

        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="site">Favoriete site</label>
        <input type="url" id="site" name="site">

    </fieldset>

    <br>

    <fieldset>
        <legend>Extra informatie</legend>

        <label for="getal1">Favoriete getal tussen 1-10</label>
        <input type="number" id="getal1" name="getal1" min="1" max="10">

        <br><br>

        <label for="getal2">Favoriete getal tussen 11-1000</label>
        <input type="range" id="getal2" name="getal2" min="11" max="1000">

        <br><br>

        <label for="geboorte">Wanneer ben je geboren?</label>
        <input type="date" id="geboorte" name="geboorte">

        <br><br>

        <label for="postcode">Belgische postcode*</label>
        <input type="text" id="postcode" name="postcode" value="9999">

    </fieldset>

    <br>

    <fieldset>
        <legend>Varia</legend>

        <label for="zoek">Zoeken naar iets</label>
        <input type="search" id="zoek" name="zoek">

        <br><br>

        <label for="kleur">Wat is je lievelingskleur?</label>
        <input type="color" id="kleur" name="kleur">

        <br><br>

        <label for="bestand">Bestand kiezen</label>
        <input type="file" id="bestand" name="bestand">

    </fieldset>

    <br>

    <input type="submit" value="Submit">

</form>


</body>
</html>
