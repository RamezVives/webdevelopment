<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Labo 17</title>
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
<h1>Formwaarden</h1>
<form id="formulier">

    <!-- checkbox -->
    <p>
        Is roker:
        <input type="checkbox" id="roker">
    </p>

    <!-- radiobuttons -->
    <p>
        Moedertaal:<br>

        <input type="radio" name="taal" value="nl"> Nederlands<br>
        <input type="radio" name="taal" value="fr"> Frans<br>
        <input type="radio" name="taal" value="en"> Engels
    </p>

    <!-- select -->
    <p>
        Favoriete buurland:
        <select id="buurland">
            <option>Nederland</option>
            <option>Frankrijk</option>
            <option>Duitsland</option>
        </select>
    </p>

    <!-- multi select -->
    <p>
        Bestelling:
        <br>
        <select id="bestelling" multiple size="6">
            <option>aardappelen</option>
            <option>brood</option>
            <option>melk</option>
            <option>biefstuk</option>
            <option>chips</option>
            <option>krant</option>
        </select>
    </p>

    <button type="button" id="toon">Toon resultaat</button>

</form>

<script src="Scripts/script.js"></script>
</body>
</html>
